[package]
name = "qqflow-server"
version = "0.3.1"
edition = "2024"
description = "Headless HTTP API + SSE service for reading local QQ NT chat records (WeFlow-compatible interface)"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
notify = "8.2"
notify-debouncer-mini = "0.7"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
