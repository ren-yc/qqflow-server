[package]
name = "qqflow-server"
version = "0.5.2"
edition = "2024"
description = "Headless HTTP API + SSE service for reading local QQ NT chat records (WeFlow-compatible interface)"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
notify = "8.2"
notify-debouncer-mini = "0.7"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenAPI 描述生成。**编译期** derive（无运行时开销），但它确实渗进了 `parser`/`store`：
# 响应里的 `MessageOut` / `MediaInfo` 是那两个模块的类型，给它们加 `ToSchema` 才能进 schema。
# 这是**有意的取舍** —— 替代方案是在 DTO 里复制一份同样的结构体，两份必然漂移。
# 库边界划定时（core 并入根 package、feature 化的那次改动）应把它换成服务层的 newtype，
# 届时这些 derive 一起搬走。
utoipa = { version = "6", features = ["axum_extras"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = true
