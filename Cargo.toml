[package]
name = "qqflow-server"
version = "0.8.0"
edition = "2024"
description = "Headless HTTP API + SSE service for reading local QQ NT chat records (WeFlow-compatible interface)"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { optional = true, version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util", "fs"] }
tokio-stream = { optional = true, version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", optional = true }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
notify = { version = "8.2", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }
tokio-util = { optional = true, version = "0.7", features = ["io"] }
tower-http = { optional = true, version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenAPI 描述生成。**编译期** derive（无运行时开销），但它确实渗进了 `parser`/`store`：
# 响应里的 `MessageOut` / `MediaInfo` 是那两个模块的类型，给它们加 `ToSchema` 才能进 schema。
# 这是**有意的取舍** —— 替代方案是在 DTO 里复制一份同样的结构体，两份必然漂移。
# 库边界划定时（core 并入根 package、feature 化的那次改动）应把它换成服务层的 newtype，
# 届时这些 derive 一起搬走。
utoipa = { optional = true, version = "6", features = ["axum_extras"] }
# 命令行子命令面的解析层。刻意 default-features = false：clap 的默认 feature 会带进
# colorhelp／suggestions 等终端装饰依赖，而本仓的 CLI 输出要能被脚本消费。
clap = { version = "4", optional = true, default-features = false, features = ["std", "env", "help", "usage", "error-context", "derive"] }
# CLI 通过 HTTP 访问服务，因此**复用同工作区的 Rust SDK**，而不是在服务端 crate 里再手写
# 一份 HTTP —— 两份实现的失败模式是漂移，而只有 SDK 那份被契约测试钉住。
qqflow-client = { path = "clients/rust", optional = true }

[[bin]]
name = "qqflow-server"
path = "src/main.rs"
# 二进制要建 tokio 运行时并起 HTTP 服务 —— 没有 `server` feature 时它没有意义，
# 与其编译出一个起不来的 bin，不如让 cargo 直接不构建它。
required-features = ["server"]

[features]
default = ["server", "cli"]

# 命令行子命令面。
#
# 为什么必须是可选 feature：`--no-default-features` 的嵌入契约要求依赖树里不含 axum／tokio
# （CI 的 embed 例子钉子守着）。本 feature 会带进 clap 与 SDK（进而 reqwest／tokio），所以
# 关掉默认 feature 时它必须一并消失，而不是变成「库用户也得下载 clap」。
cli = ["dep:clap", "dep:qqflow-client", "dep:tokio", "server"]

# 服务层：HTTP/SSE。依赖 axum、tokio 运行时与 utoipa（OpenAPI 描述）。
server = ["dep:axum", "dep:utoipa", "dep:tower-http", "dep:tokio-stream", "dep:tokio-util", "dep:tokio", "sync"]

# 同步引擎：watcher 与水位线增量。
sync = ["dep:tokio", "dep:notify", "dep:notify-debouncer-mini", "dep:async-stream", "dep:futures-util", "dep:tokio-stream"]

# 造库/造密钥工具。
#
# 两个用途：① 嵌入者写自己的测试时要造一份假库；② 本仓库的集成测试在**独立 crate** 里，
# 只能看见 pub —— 默认构建下实现面是 pub(crate)（边界由编译器强制），开了它才转成 pub。
testing = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
members = ["clients/rust", "clients/regen"]
resolver = "3"
